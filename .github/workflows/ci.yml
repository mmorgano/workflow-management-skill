name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: ./tests/smoke-test.sh

  powershell:
    name: PowerShell smoke test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        shell: pwsh
        run: ./tests/smoke-test.ps1
